<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0c0f">
<title>F1 Live Dashboard</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%23e10600'/%3E%3C/svg%3E">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/panels.css">
<link rel="stylesheet" href="css/chasecam.css">
<link rel="stylesheet" href="css/session.css">
</head>
<body data-view="race" data-tower="auto">
<header id="panel-header"></header>
<nav id="toolbar"><div class="tb-views"></div><div class="tb-alerts"></div><button id="help-btn" title="Shortcuts (?)" onclick="document.dispatchEvent(new KeyboardEvent('keydown',{key:'?'}))">?</button></nav>
<main id="grid">
  <section id="panel-tower" class="panel"><div class="ph">Timing</div><div class="pb"></div></section>
  <section id="panel-map" class="panel"><div class="ph">Track</div><div class="pb"></div></section>
  <section id="panel-side" class="panel">
    <div class="side-sec"><div class="ph">Race control</div><div class="pb" id="rc-body"></div></div>
    <div class="side-sec"><div class="ph">Team radio</div><div class="pb" id="radio-body"></div></div>
  </section>
  <section id="panel-deepdive" class="panel"><div class="ph">Deep dive</div><div class="pb"></div></section>
  <section id="panel-analytics" class="panel"><div class="ph">Analytics</div><div class="pb"></div></section>
  <section id="panel-chasecam" class="panel"><div class="ph">3D chase cam</div><div class="pb"></div></section>
</main>
<script type="module" src="js/app.js"></script>
</body>
</html>
